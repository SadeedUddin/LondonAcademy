<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In | London UK Academy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap">
  <link rel="stylesheet" href="lms.css?v=20260930a">
  <link rel="stylesheet" href="lauk-register.css?v=1">
  <link rel="icon" type="image/png" href="../favicon.png">
  <style>
    body.reg-page { margin: 0; background: #F7F4EE; color: #101828; }
    @media (prefers-color-scheme: dark) { body.reg-page { background: #070A11; color: #EDF1F8; } }
    #lauk-register .kc-layout.is-single { grid-template-columns: minmax(0, 400px); justify-content: center; }
    #lauk-register .kc-subtitle { margin: -8px 0 20px; font-size: 14px; color: var(--text-tertiary); }
    #lauk-register .kc-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 14px; font-size: 13px; color: var(--text-secondary); }
    #lauk-register .kc-row label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    #lauk-register .kc-row input { accent-color: #C9A227; width: 15px; height: 15px; }
    #lauk-register .kc-link { color: var(--text-primary); font-weight: 600; text-decoration: underline; text-decoration-color: var(--border-strong); text-underline-offset: 3px; background: none; border: 0; padding: 0; cursor: pointer; font: inherit; }
    #lauk-register .kc-link:hover { text-decoration-color: currentColor; }
    #lauk-register .kc-google { margin-top: 0; }
    #lauk-register .kc-error { margin-top: 14px; }
    #lauk-register .kc-error[hidden] { display: none; }
    #lauk-register .kc-brand { justify-content: center; margin-bottom: 22px; }
    #lauk-register .kc-brand a { display: block; max-width: 100%; }
    #lauk-register .kc-brand-logo { height: 56px; width: auto; max-width: 100%; object-fit: contain; }

    /* Page slide between Sign in and Create account (Chrome, Edge, Safari 18.2+; others just navigate) */
    @view-transition { navigation: auto; }
    .lauk-back { view-transition-name: auth-back; }
    ::view-transition-group(*) { animation-duration: 480ms; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); }
    ::view-transition-old(root), ::view-transition-new(root) { animation: none; }
    @keyframes auth-in-right  { from { transform: translateX(90px);  opacity: 0; } }
    @keyframes auth-in-left   { from { transform: translateX(-90px); opacity: 0; } }
    @keyframes auth-out-left  { to   { transform: translateX(-90px); opacity: 0; } }
    @keyframes auth-out-right { to   { transform: translateX(90px);  opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; } }
    #lauk-register .kc-card { view-transition-name: signin-card; }
    ::view-transition-old(signup-card) { animation: auth-out-right 380ms cubic-bezier(0.4, 0, 1, 1) both; }
    ::view-transition-old(key-stage)   { animation: auth-out-left 340ms cubic-bezier(0.4, 0, 1, 1) both; }
    ::view-transition-new(signin-card) { animation: auth-in-left 520ms cubic-bezier(0.22, 1, 0.36, 1) 80ms both; }
  </style>
</head>
<body class="reg-page">
  <a class="lauk-back" href="../index.html">&larr; Back to website</a>
  <div id="lauk-register">
    <div class="key-cut-root">
      <div class="kc-layout is-single">
        <section class="kc-card" aria-labelledby="signinTitle">
          <div class="kc-brand">
            <a href="../index.html" title="Return to main website"><picture><source srcset="../lauk-logo-light.webp?v=1" media="(prefers-color-scheme: light)"><img class="kc-brand-logo" src="../lauk-logo.webp?v=3" alt="London UK Academy" width="800" height="150"></picture></a>
          </div>
          <h1 id="signinTitle" class="kc-title">Welcome back</h1>
          <p class="kc-subtitle">Sign in to continue your learning journey.</p>

          <form class="kc-form" id="loginForm" novalidate>
            <div class="kc-field">
              <label for="loginEmail" class="kc-label">Email</label>
              <input id="loginEmail" class="kc-input" type="email" name="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" placeholder="you@example.com" maxlength="120" required>
            </div>
            <div class="kc-field">
              <label for="loginPassword" class="kc-label">Password</label>
              <div class="kc-input-wrap">
                <input id="loginPassword" class="kc-input kc-input-password" type="password" name="password" autocomplete="current-password" placeholder="Enter your password" maxlength="256" required>
                <button type="button" class="kc-eye" id="togglePw" aria-pressed="false" aria-controls="loginPassword" aria-label="Show password">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="M4 4l16 16" style="display:none"/></svg>
                </button>
              </div>
            </div>

            <div class="kc-row">
              <label><input type="checkbox" id="rememberMe"> Remember me for 7 days</label>
              <button type="button" class="kc-link" id="forgotPw">Forgot password?</button>
            </div>

            <p class="kc-status kc-error" id="loginError" role="alert" hidden></p>

            <button type="submit" class="kc-submit" id="loginBtn" data-unlocked>
              <span class="kc-submit-icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg></span>
              <span id="loginBtnText">Sign in</span>
            </button>
          </form>

          <div class="kc-divider"><span>or</span></div>
          <button type="button" class="kc-google" id="demoBtn"><span>Try the student demo (sample data)</span></button>

          <p class="kc-signin">Don&rsquo;t have an account? <a href="register.html">Create one</a></p>
        </section>
      </div>
    </div>
  </div>

<script src="lms.js?v=20260915b"></script>
<script>
  const host = document.getElementById('lauk-register');
  const darkMq = window.matchMedia('(prefers-color-scheme: dark)');
  const syncTheme = () => { host.dataset.theme = document.documentElement.dataset.theme || (darkMq.matches ? 'dark' : 'light'); };
  syncTheme();
  darkMq.addEventListener('change', syncTheme);

  const params = new URLSearchParams(location.search);
  const nextUrl = LMS.safeNext(params.get('next'), null);
  const destFor = (user) => user.role === 'admin'
    ? (nextUrl || 'admin.html')
    : (nextUrl && nextUrl !== 'admin.html' ? nextUrl : 'dashboard.html');

  // Already signed in? Go straight in.
  const existing = LMS.getSession();
  if (existing) window.location.replace(destFor(existing));

  // Account creation lives on its own page.
  if (location.hash === '#register' || params.get('tab') === 'register') {
    window.location.replace('register.html' + (nextUrl ? '?next=' + encodeURIComponent(nextUrl) : ''));
  }
  window.addEventListener('hashchange', () => { if (location.hash === '#register') window.location.href = 'register.html'; });

  const pw = document.getElementById('loginPassword');
  document.getElementById('togglePw').addEventListener('click', function () {
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    this.setAttribute('aria-pressed', String(show));
    this.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    this.querySelector('.eye-slash').style.display = show ? '' : 'none';
  });

  document.getElementById('forgotPw').addEventListener('click', () => {
    LMS.showToast('To reset your password, email info@londonukacademy.uk from your registered address.', 'info', 6000);
  });

  let busy = false;
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    if (busy) return;
    const email = document.getElementById('loginEmail').value;
    const pass = pw.value;
    const remember = document.getElementById('rememberMe').checked;
    const errEl = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');
    const btnText = document.getElementById('loginBtnText');
    errEl.hidden = true;
    busy = true;
    btnText.textContent = 'Signing in…';
    btn.setAttribute('aria-disabled', 'true');
    btn.dataset.state = 'sending';
    try {
      const user = await LMS.login(email, pass, remember);
      pw.value = '';
      LMS.showToast(`Welcome back, ${user.name.split(' ')[0]}!`, 'success');
      setTimeout(() => window.location.href = destFor(user), 500);
    } catch (err) {
      errEl.textContent = err.message;
      errEl.hidden = false;
      btnText.textContent = 'Sign in';
      btn.removeAttribute('aria-disabled');
      delete btn.dataset.state;
    } finally {
      busy = false;
    }
  });

  document.getElementById('demoBtn').addEventListener('click', () => {
    const user = LMS.demoLogin();
    LMS.showToast(`Opening the demo as ${user.name.split(' ')[0]}…`, 'info');
    setTimeout(() => window.location.href = 'dashboard.html', 400);
  });
</script>
</body>
</html>
