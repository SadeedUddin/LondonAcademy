            <circle cx="35" cy="35" r="18" fill="#E6C765" fill-opacity="0.2"/>
            <text x="35" y="40" font-family="sans-serif" font-size="14" fill="#E6C765" text-anchor="middle" font-weight="bold">03</text>
            <text x="65" y="35" font-family="sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Decision Intelligence</text>
            <circle cx="24" cy="66" r="3" fill="#E6C765"/><text x="34" y="70" font-family="sans-serif" font-size="11" fill="#CBD5E0">Predictive Analytics</text>
            <circle cx="24" cy="86" r="3" fill="#E6C765"/><text x="34" y="90" font-family="sans-serif" font-size="11" fill="#CBD5E0">Machine Learning BI</text>
            <circle cx="24" cy="106" r="3" fill="#E6C765"/><text x="34" y="110" font-family="sans-serif" font-size="11" fill="#CBD5E0">Real-Time Dashboards</text>
