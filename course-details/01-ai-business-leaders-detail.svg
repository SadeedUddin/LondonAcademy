            <circle cx="24" cy="106" r="3" fill="#E6C765"/><text x="34" y="110" font-family="sans-serif" font-size="11" fill="#CBD5E0">Executive AI Roadmap</text>
            <rect x="20" y="128" width="80" height="20" rx="4" fill="#E6C765" fill-opacity="0.2"/><text x="60" y="142" font-family="sans-serif" font-size="10" fill="#E6C765" text-anchor="middle">Phase 1</text>
        </g>
        <g transform="translate(305, 0)">
