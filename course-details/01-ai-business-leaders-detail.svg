        </g>
        <g transform="translate(305, 180)">
            <rect width="275" height="160" rx="12" fill="url(#cardBg)" stroke="#E6C765" stroke-opacity="0.4"/>
            <circle cx="35" cy="35" r="18" fill="#E6C765" fill-opacity="0.2"/>
            <text x="35" y="40" font-family="sans-serif" font-size="14" fill="#E6C765" text-anchor="middle" font-weight="bold">04</text>
            <text x="65" y="35" font-family="sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Governance &amp; Ethics</text>
            <circle cx="24" cy="66" r="3" fill="#E6C765"/><text x="34" y="70" font-family="sans-serif" font-size="11" fill="#CBD5E0">Responsible AI Standards</text>
