            <text x="67" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Threat Detection</text>
            <text x="67" y="52" font-family="sans-serif" font-size="10" fill="#CBD5E0" text-anchor="middle">SIEM &amp; AI Monitoring</text>
            <text x="67" y="68" font-family="sans-serif" font-size="10" fill="#CBD5E0" text-anchor="middle">Anomaly Alerts</text>
            <rect x="25" y="82" width="85" height="18" rx="4" fill="#E6C765" fill-opacity="0.2"/><text x="67" y="94" font-family="sans-serif" font-size="9" fill="#E6C765" text-anchor="middle">Active Guard</text>
        </g>
        <g transform="translate(444, 220)">
            <rect width="135" height="110" rx="8" fill="url(#cardBg)" stroke="#E6C765" stroke-opacity="0.3"/>
            <text x="67" y="28" font-family="sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Incident Response</text>
