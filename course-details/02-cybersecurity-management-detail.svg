<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="100%" height="100%">
<defs>
  <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#09142A"/>
    <stop offset="50%" stop-color="#0D1E3F"/>
    <stop offset="100%" stop-color="#14264C"/>
  </linearGradient>
  <radialGradient id="goldGlow" cx="50%" cy="30%" r="65%">
    <stop offset="0%" stop-color="#E6C765" stop-opacity="0.2"/>
    <stop offset="100%" stop-color="#E6C765" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#E6C765"/>
    <stop offset="100%" stop-color="#9A7A16"/>
  </linearGradient>
  <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.09"/>
    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03"/>
  </linearGradient>
  <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="3" cy="3" r="1.2" fill="#FFFFFF" fill-opacity="0.06"/>
  </pattern>
</defs>

<rect width="640" height="480" fill="url(#bgGrad)"/>
<rect width="640" height="480" fill="url(#dotGrid)"/>
<rect width="640" height="480" fill="url(#goldGlow)"/>

<!-- Header -->
<g transform="translate(30, 20)">
  <rect x="0" y="0" width="580" height="56" rx="10" fill="url(#cardBg)" stroke="url(#goldBorder)" stroke-opacity="0.35"/>
  <rect x="16" y="14" width="150" height="26" rx="13" fill="#E6C765" fill-opacity="0.15" stroke="#E6C765" stroke-opacity="0.6"/>
  <text x="91" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#E6C765" text-anchor="middle" letter-spacing="1">SECURITY ARCHITECTURE</text>
  <text x="182" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Defense-in-Depth &amp;amp; Risk Matrix</text>
</g>

<!-- Content -->

    <g transform="translate(30, 95)">
